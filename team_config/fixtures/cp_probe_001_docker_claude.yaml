team_id: cp-probe-001-docker-claude
version: 1
runtime_profiles:
  docker-default:
    kind: docker
    image: coordplane/claude-runtime:release-health
    workspace_mode: isolated
termination:
  terminal_contract_type: root
  accepted_by_capability: validation.assessment
communication:
  allow_direct_message: true
  allow_followup_task: true
  task_requires_contract: true
  signal_summary_max_bytes: 160
  signal_body_max_bytes: 240
  default_trigger_turn:
    message: true
    task: true
    result: true
    repair: true
agents:
  - id: coordinator
    role_prompt: |-
      Coordinate CP-PROBE-001 through explicit contracts, mailbox follow-up, and concise evidence summaries.
      Delegate implementation and verification work only through CoordPlane capabilities.
    runtime_profile: docker-default
    cli_backend: claude
    skills:
      - contract-delegation
      - coordplane-service
    capabilities:
      - assignment.next
      - assignment.watch
      - communication.read
      - contract.add
      - contract.complete
      - contract.context
      - contract.current
      - contract.wait
      - mailbox.get
      - mailbox.list
      - mailbox.resolve
      - message.send
      - object.inspect
      - object.read
      - report.submit
  - id: developer-a
    role_prompt: |-
      Claim the Developer A contract and use controlled Git plus command.run inside the Docker workspace.
      Do not read backend storage, host execution directories, Docker sockets, or another agent workspace.
    runtime_profile: docker-default
    cli_backend: claude
    skills:
      - controlled-git
      - coordplane-service
    capabilities:
      - assignment.next
      - assignment.watch
      - changeset.abandon
      - changeset.submit
      - command.run
      - communication.read
      - contract.complete
      - contract.context
      - contract.current
      - git.abort
      - git.commit
      - git.conflicts
      - git.diff
      - git.log
      - git.merge_apply
      - git.merge_preview
      - git.recover
      - git.resolve
      - git.rollback
      - git.status
      - object.inspect
      - object.read
      - report.submit
      - workspace.prepare
      - workspace.status
      - workspace.sync
  - id: developer-b
    role_prompt: |-
      Claim the Developer B contract and continue from stale or conflict feedback in the same Docker session.
      Do not read backend storage, host execution directories, Docker sockets, or another agent workspace.
    runtime_profile: docker-default
    cli_backend: claude
    skills:
      - controlled-git
      - coordplane-service
    capabilities:
      - assignment.next
      - assignment.watch
      - changeset.abandon
      - changeset.submit
      - command.run
      - communication.read
      - contract.complete
      - contract.context
      - contract.current
      - contract.wait
      - git.abort
      - git.commit
      - git.conflicts
      - git.diff
      - git.log
      - git.merge_apply
      - git.merge_preview
      - git.recover
      - git.resolve
      - git.rollback
      - git.status
      - object.inspect
      - object.read
      - report.submit
      - workspace.prepare
      - workspace.status
      - workspace.sync
  - id: verifier
    role_prompt: |-
      Verify CP-PROBE-001 from contract context, changeset summaries, object references, command evidence, and Git operation state.
      Submit validation.assessment before the coordinator completes the root contract.
    runtime_profile: docker-default
    cli_backend: claude
    skills:
      - controlled-git
      - coordplane-service
    capabilities:
      - assignment.next
      - assignment.watch
      - command.run
      - communication.read
      - contract.complete
      - contract.context
      - contract.current
      - git.log
      - mailbox.get
      - mailbox.list
      - mailbox.resolve
      - object.inspect
      - object.read
      - report.submit
      - validation.assessment
      - workspace.prepare
      - workspace.status
      - workspace.sync
