team_id: cp-accept-001-three-agent-docker-claude
version: 1
runtime_profiles:
  docker-default:
    kind: docker
    image: coordplane/claude-runtime:release-health
    workspace_mode: isolated
    command_policy:
      non_interactive_approval: true
      allow_coordlink_capabilities:
        - assignment.next
        - assignment.watch
        - changeset.abandon
        - changeset.submit
        - command.run
        - communication.read
        - contract.add
        - contract.complete
        - contract.context
        - contract.current
        - contract.wait
        - git.abort
        - git.commit
        - git.conflicts
        - git.diff
        - git.log
        - git.merge_apply
        - git.merge_preview
        - git.recover
        - git.resolve
        - git.rollback
        - git.status
        - mailbox.get
        - mailbox.list
        - mailbox.resolve
        - message.send
        - object.inspect
        - object.read
        - report.submit
        - validation.assessment
        - workspace.prepare
        - workspace.status
        - workspace.sync
termination:
  terminal_contract_type: root
  accepted_by_capability: validation.assessment
communication:
  allow_direct_message: true
  allow_followup_task: true
  task_requires_contract: true
  signal_summary_max_bytes: 160
  signal_body_max_bytes: 240
  default_trigger_turn:
    message: true
    task: true
    result: true
    repair: true
agents:
  - id: coordinator
    role_prompt: |-
      CP-ACCEPT-001 release-health uses a deterministic driver after this real Docker/Claude session starts.
      Startup handshake only: run exactly `/usr/local/bin/coordlink call contract.current`, then stop and summarize HANDSHAKE_DONE.
      Do not call contract.add, contract.wait, mailbox.*, report.submit, validation.assessment, or contract.complete during startup.
      Do not ask for approval and do not use coordlink shortcut forms.
    runtime_profile: docker-default
    cli_backend: claude
    skills:
      - contract-delegation
      - coordplane-service
    capabilities:
      - assignment.next
      - assignment.watch
      - communication.read
      - contract.add
      - contract.complete
      - contract.context
      - contract.current
      - contract.wait
      - mailbox.get
      - mailbox.list
      - mailbox.resolve
      - message.send
      - object.inspect
      - object.read
      - report.submit
  - id: developer
    role_prompt: |-
      CP-ACCEPT-001 release-health uses a deterministic driver after this real Docker/Claude session starts.
      Startup handshake only: run exactly `/usr/local/bin/coordlink call contract.current`, then stop and summarize HANDSHAKE_DONE.
      Do not call command.run, report.submit, git.*, changeset.*, or contract.complete during startup.
      Do not ask for approval and do not use coordlink shortcut forms.
    runtime_profile: docker-default
    cli_backend: claude
    skills:
      - controlled-git
      - coordplane-service
    capabilities:
      - assignment.next
      - assignment.watch
      - changeset.abandon
      - changeset.submit
      - command.run
      - communication.read
      - contract.complete
      - contract.context
      - contract.current
      - git.abort
      - git.commit
      - git.conflicts
      - git.diff
      - git.log
      - git.merge_apply
      - git.merge_preview
      - git.recover
      - git.resolve
      - git.rollback
      - git.status
      - object.inspect
      - object.read
      - report.submit
      - workspace.prepare
      - workspace.status
      - workspace.sync
  - id: verifier
    role_prompt: |-
      CP-ACCEPT-001 release-health uses a deterministic driver after this real Docker/Claude session starts.
      Startup handshake only: run exactly `/usr/local/bin/coordlink call contract.current`, then stop and summarize HANDSHAKE_DONE.
      Do not call validation.assessment, report.submit, or contract.complete during startup.
      Do not ask for approval and do not use coordlink shortcut forms.
    runtime_profile: docker-default
    cli_backend: claude
    skills:
      - coordplane-service
    capabilities:
      - assignment.next
      - assignment.watch
      - communication.read
      - contract.complete
      - contract.context
      - contract.current
      - mailbox.get
      - mailbox.list
      - mailbox.resolve
      - object.inspect
      - object.read
      - report.submit
      - validation.assessment
