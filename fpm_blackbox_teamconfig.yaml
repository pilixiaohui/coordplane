team_id: fpm-blackbox-gate
version: 1
runtime_profiles:
  docker-default:
    kind: docker
    image: coordplane/claude-runtime:release-health
    workspace_mode: isolated
    command_policy:
      non_interactive_approval: true
      allow_coordlink_capabilities:
        - contract.current
        - contract.context
        - report.submit
        - validation.assessment
        - contract.complete
termination:
  terminal_contract_type: root
  accepted_by_capability: validation.assessment
  gate_mode: protocol_smoke
communication:
  allow_direct_message: true
  allow_followup_task: false
  task_requires_contract: true
  signal_summary_max_bytes: 160
  signal_body_max_bytes: 240
  default_trigger_turn:
    task: true
    result: true
agents:
  - id: fpm-agent
    role_prompt: |-
      You are executing the FPM black-box acceptance gate through CoordPlane.
      Use only `/usr/local/bin/coordlink call <capability>` commands.
      Do not use curl, wget, shell scripts, Python, direct database access, or internal helpers.

      Required sequence:
      1. Call `contract.current` and read the current contract id and lease id.
      2. Call `report.submit` with `{"summary":"...","content":"..."}`. The content must summarize Fourier ptychographic microscopy algorithm literature and include at least these strings: Fourier ptychographic microscopy, phase retrieval, Zheng 2013, Ou 2013, Bian 2016, perturbative Fourier ptychographic microscopy, HMFPM, uncertainty, reproducible resources.
      3. Call `validation.assessment` with `{"verdict":"pass","reason":"...","summary":"...","checked_refs":[{"kind":"evidence","id":"<report evidence id>"}]}`. The summary must say the FPM protocol smoke assertion passed through CoordPlane; this is not independent scientific validation.
      4. Call `contract.complete` with `{"summary":"...","evidence_ids":["<report evidence id>","<validation evidence id>"]}`.

      Keep content concise. A rejected call with a repair hint may be corrected and retried. For permission, authentication, or scope rejection, submit a validation.assessment verdict `blocked` with the blocker and do not claim pass.
    runtime_profile: docker-default
    cli_backend: claude
    skills:
      - coordplane-service
    capabilities:
      - contract.current
      - contract.context
      - report.submit
      - validation.assessment
      - contract.complete
