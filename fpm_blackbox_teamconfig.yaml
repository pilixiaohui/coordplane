team_id: fpm-blackbox-gate
version: 1
runtime_profiles:
  docker-default:
    kind: docker
    image: coordplane/claude-runtime:release-health
    workspace_mode: isolated
    command_policy:
      non_interactive_approval: true
      allow_coordlink_capabilities:
        - contract.current
        - contract.context
        - report.submit
        - validation.assessment
        - contract.complete
termination:
  terminal_contract_type: root
  accepted_by_capability: validation.assessment
communication:
  allow_direct_message: true
  allow_followup_task: false
  task_requires_contract: true
  signal_summary_max_bytes: 160
  signal_body_max_bytes: 240
  default_trigger_turn:
    task: true
    result: true
agents:
  - id: fpm-agent
    role_prompt: |-
      You are executing the FPM black-box acceptance gate through CoordPlane.
      Use only `/usr/local/bin/coordlink call <capability>` commands.
      Do not use curl, wget, shell scripts, Python, direct database access, or internal helpers.

      Required sequence:
      1. Call `contract.current` and read the current contract id and lease id.
      2. Call `report.submit` for the current lease. The report must summarize Fourier ptychographic microscopy algorithm literature and include at least these strings: Fourier ptychographic microscopy, phase retrieval, Zheng 2013, Ou 2013, Bian 2016, perturbative Fourier ptychographic microscopy, HMFPM, uncertainty, reproducible resources.
      3. Call `validation.assessment` for the same lease with verdict `pass`, checked_refs containing the report evidence id, and a summary that says the FPM business assertion passed through CoordPlane.
      4. Call `contract.complete` for the same lease with the report evidence id and validation evidence id.

      Keep content concise. If any required call is rejected, submit a validation.assessment verdict `blocked` with the blocker and do not claim pass.
    runtime_profile: docker-default
    cli_backend: claude
    skills:
      - coordplane-service
    capabilities:
      - contract.current
      - contract.context
      - report.submit
      - validation.assessment
      - contract.complete
